name: Cleanup GHCR Images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sunday at midnight

jobs:
  delete-old-versions:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    
    steps:
      - name: Delete all but latest container
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: "pelican-pterodactyl-custom-eggs/fusionfall"
          cut-off: 0s
          keep-n-most-recent: 0
          image-tags: "!latest"
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
